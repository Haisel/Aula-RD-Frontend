<!doctype html>
<html lang="es-DO">
<head>
{{> layouts/head}}
</head>
<body>
<a class="au-skip-link" href="#contenido">Saltar al formulario</a>
<div class="au-auth">
  {{> layouts/auth-aside asideTitle="Bienvenido de nuevo a su aula."}}
  <main id="contenido" class="au-auth-main">
    <form class="au-auth-form is-narrow" data-au-validate="login" data-au-submit="event"
          data-au-success="Datos válidos. Conecte este formulario a su API con data-au-submit=&quot;ajax&quot;." action="#" method="post" novalidate>
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h1>Iniciar sesión</h1>
          <p class="text-body-secondary mb-0">Use el correo de su institución.</p>
        </div>
        <button class="btn btn-ghost au-btn-icon" type="button" data-au-theme-toggle aria-label="Cambiar tema"><i class="bi bi-moon-stars" aria-hidden="true"></i></button>
      </div>
      <div class="alert alert-danger d-none" role="alert" data-au-form-error></div>
      <div>
        <label class="form-label" for="email">Correo</label>
        <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="username" placeholder="nombre@colegio.edu.do">
      </div>
      <div>
        <div class="d-flex justify-content-between"><label class="form-label" for="password">Contraseña</label><a class="small fw-semibold" href="#">¿La olvidó?</a></div>
        <div class="input-group input-group-lg">
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
          <button class="btn btn-outline-primary" type="button" data-au-password-toggle="#password"><i class="bi bi-eye" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
        <label class="form-check-label" for="recordar">Mantener la sesión en este dispositivo</label>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
      <p class="text-center text-body-secondary small mb-0">¿Su institución aún no usa Aula RD? <a href="suscribir.html">Suscríbala</a></p>
    </form>
  </main>
</div>
</body>
</html>
